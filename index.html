<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストップウォッチ</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #0f172a);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #f1f5f9;
    padding: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: #a5b4fc;
    margin: 0 0 24px;
  }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .display .ms {
    font-size: 28px;
    color: #94a3b8;
  }
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 28px 0 8px;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
    min-width: 96px;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #startStop {
    background: #22c55e;
    color: #052e16;
  }
  #startStop.running {
    background: #ef4444;
    color: #450a0a;
  }
  #lap {
    background: rgba(255, 255, 255, 0.12);
    color: #f1f5f9;
  }
  #reset {
    background: transparent;
    color: #94a3b8;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  .laps {
    margin-top: 20px;
    max-height: 220px;
    overflow-y: auto;
    text-align: left;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 8px;
  }
  .laps ol {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 10px 6px;
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
  }
  .laps li span:first-child {
    color: #64748b;
  }
  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>
  <div class="card">
    <h1>STOPWATCH</h1>
    <div class="display" id="display">00:00<span class="ms">.00</span></div>
    <div class="controls">
      <button id="startStop">スタート</button>
      <button id="lap" disabled>ラップ</button>
      <button id="reset" disabled>リセット</button>
    </div>
    <div class="laps">
      <ol id="lapList"></ol>
    </div>
  </div>

<script>
  const displayEl = document.getElementById('display');
  const startStopBtn = document.getElementById('startStop');
  const lapBtn = document.getElementById('lap');
  const resetBtn = document.getElementById('reset');
  const lapList = document.getElementById('lapList');

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let rafId = null;
  let lapCount = 0;
  let lastLapElapsed = 0;

  function format(ms) {
    const totalMs = Math.floor(ms);
    const minutes = Math.floor(totalMs / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);
    const pad = (n, len = 2) => String(n).padStart(len, '0');
    return { main: `${pad(minutes)}:${pad(seconds)}`, ms: pad(centis) };
  }

  function render(ms) {
    const { main, ms: centis } = format(ms);
    displayEl.innerHTML = `${main}<span class="ms">.${centis}</span>`;
  }

  function tick() {
    const now = performance.now();
    render(elapsed + (now - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
    startStopBtn.textContent = 'ストップ';
    startStopBtn.classList.add('running');
    lapBtn.disabled = false;
    resetBtn.disabled = false;
  }

  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed += performance.now() - startTime;
    render(elapsed);
    startStopBtn.textContent = 'スタート';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    lapCount = 0;
    lastLapElapsed = 0;
    render(0);
    lapList.innerHTML = '';
    startStopBtn.textContent = 'スタート';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
    resetBtn.disabled = true;
  }

  function addLap() {
    const current = elapsed + (performance.now() - startTime);
    const split = current - lastLapElapsed;
    lastLapElapsed = current;
    lapCount += 1;
    const { main: totalMain, ms: totalMs } = format(current);
    const { main: splitMain, ms: splitMs } = format(split);
    const li = document.createElement('li');
    li.innerHTML = `<span>Lap ${lapCount} (+${splitMain}.${splitMs})</span><span>${totalMain}.${totalMs}</span>`;
    lapList.prepend(li);
  }

  startStopBtn.addEventListener('click', () => {
    running ? stop() : start();
  });
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      running ? stop() : start();
    } else if (e.code === 'KeyL' && running) {
      addLap();
    } else if (e.code === 'KeyR' && !running) {
      reset();
    }
  });
</script>
</body>
</html>
